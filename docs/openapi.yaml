            createdAt: '2026-11-13T14:00:00.000Z'
            updatedAt: '2026-11-13T15:00:00.000Z'
        pagination:
          page: 1
          limit: 10
          total: 2
          totalPages: 1
    EmptyPostList:
      summary: A page past the end (still 200)
      value:
        data: []
        pagination:
          page: 5
          limit: 10
          total: 2
          totalPages: 1
    CmsPostList:
      summary: First page of the CMS list (drafts included, newest createdAt first)
      value:
        data:
          - id: '674f2a10b1c2d3e4f5a6b7d1'
            title: Indexing strategies in MongoDB
            body: 'Compound indexes follow the ESR rule: equality, sort, range.'
            hashtags: [mongodb, performance]
            status: draft
            author: Brian Fox
            publishedAt: null
            createdAt: '2026-11-14T11:30:00.000Z'
            updatedAt: '2026-11-14T11:30:00.000Z'
          - id: '674f1c2ab1c2d3e4f5a6b7c8'
            title: Hello Express 5
            body: Plain text or Markdown, returned verbatim.
            hashtags: [nodejs, express]
            status: published
            author: Brian Fox
            publishedAt: '2026-11-14T10:00:00.000Z'
            createdAt: '2026-11-14T09:00:00.000Z'
            updatedAt: '2026-11-14T10:00:00.000Z'
          - id: '674dd8a4b1c2d3e4f5a6b7b2'
            title: Modeling posts in MongoDB
            body: One collection, two read models.
            hashtags: [mongodb, nodejs]
            status: published
            author: Brian Fox
            publishedAt: '2026-11-13T15:00:00.000Z'
            createdAt: '2026-11-13T14:00:00.000Z'
            updatedAt: '2026-11-13T15:00:00.000Z'
        pagination:
          page: 1
          limit: 10
